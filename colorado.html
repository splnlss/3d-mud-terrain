<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Colorado • Mud globe</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#29251e;color:#eee4d5;font:14px/1.5 system-ui}canvas{width:100%;height:100%;display:block;touch-action:none}header{position:absolute;top:24px;left:28px;pointer-events:none}h1{font-size:22px;font-weight:500;margin:0 0 4px}p{margin:0;color:#c5b9a6}nav{position:absolute;right:24px;top:24px;display:flex;gap:8px;flex-wrap:wrap;max-width:48%;justify-content:flex-end}button,a{font:inherit;background:#39332c;color:#eee4d5;border:1px solid #76664f;border-radius:6px;padding:7px 12px;cursor:pointer;text-decoration:none}button:hover,a:hover{background:#554937}footer{position:absolute;bottom:20px;left:28px;right:28px;pointer-events:none;color:#c5b9a6;font-size:12px}#info{position:absolute;bottom:20px;left:28px;color:#c5b9a6;font-size:12px;pointer-events:none}#places{position:absolute;inset:0;pointer-events:none;overflow:hidden}.place{position:absolute;left:0;top:0;display:flex;align-items:center;gap:7px;white-space:nowrap;transition:opacity .2s;will-change:transform}.place .dot{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#f4ead9;border:2px solid #3a2a1a;box-shadow:0 0 0 1px rgba(244,234,217,.5)}.place .name{margin-top:-4.5px;font-size:13px;color:#f4ead9;text-shadow:0 1px 3px #000,0 0 6px rgba(0,0,0,.8)}.place.river .name{margin:0;transform:translate(-50%,-50%);font-size:12px;font-style:italic;letter-spacing:.04em;color:#cfe3ef}.hide-places .town,.hide-rivers .river{display:none}@media(max-width:650px){header{top:16px;left:16px}h1{font-size:18px}header p{max-width:170px}nav{top:105px;left:16px;right:16px;max-width:none;justify-content:flex-start}footer{left:16px}}
</style></head><body><div id="places"></div><canvas id="terrain" aria-label="Colorado mud globe. Drag to orbit; scroll to zoom; right drag to pan."></canvas>
<header><h1>Colorado</h1></header>

<div id="info" hidden></div>
<script type="module" src="/src/colorado.ts"></script></body></html>
